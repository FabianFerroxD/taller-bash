# Configuración de Base de Datos
# Archivo: database.conf
# Última modificación: 2025-10-08

[production]
host=db.production.com
port=5432
database=app_prod
user=prod_user
max_connections=200
timeout=30

[development]
host=localhost
port=5432
database=app_dev
user=dev_user
max_connections=50
timeout=10

[testing]
host=localhost
port=5433
database=app_test
user=test_user
max_connections=20
timeout=5

[backup]
enabled=true
frequency=daily
retention_days=30
destination=/backup/database
